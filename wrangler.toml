name = "ohmygosh"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# 说明：
# 如果您在 Cloudflare Pages 控制台后台直接绑定（推荐方式）：
#   路径：Pages 项目 -> 设置 (Settings) -> Functions -> 绑定 (Bindings)
#   - D1 数据库绑定变量名：DB
#   - KV 命名空间绑定变量名：SNIPPETS_KV
#
# 如果您想通过 wrangler.toml 绑定，请在 Cloudflare 创建后填入真实的 32位十六进制 ID（勿填占位符）：
#
# [[d1_databases]]
# binding = "DB"
# database_name = "ohmygosh-db"
# database_id = "您的真实D1-UUID"
#
# [[kv_namespaces]]
# binding = "SNIPPETS_KV"
# id = "您的真实KV-ID"
