name = "ohmygosh"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Cloudflare D1 Database Binding for CloudPaste
# Run: npx wrangler d1 create ohmygosh-db
# Then paste your database_id below, or bind "DB" in Cloudflare Pages Dashboard -> Settings -> Functions -> D1 Database Bindings
[[d1_databases]]
binding = "DB"
database_name = "ohmygosh-db"
database_id = "binding-db"

# Optional Cloudflare KV Binding (for key-value fast caching)
[[kv_namespaces]]
binding = "SNIPPETS_KV"
id = "binding-kv"
