<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGlow)" stroke="#f97316" stroke-opacity="0.3" stroke-width="8"/>

  <!-- Subtle Cloud shape backing -->
  <path d="M 180 230 C 180 180, 230 150, 280 170 C 310 140, 370 150, 380 200 C 420 200, 430 250, 400 290 C 420 330, 380 370, 340 360 L 180 360 C 130 360, 110 300, 150 260 C 140 230, 160 210, 180 230 Z" 
        fill="#f97316" fill-opacity="0.08" />

  <!-- Code Brackets < /> -->
  <g stroke="url(#orangeGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 180 196 L 112 256 L 180 316" />
    <!-- Slash / -->
    <path d="M 284 172 L 228 340" />
    <!-- Right Bracket > -->
    <path d="M 332 196 L 400 256 L 332 316" />
  </g>
</svg>
